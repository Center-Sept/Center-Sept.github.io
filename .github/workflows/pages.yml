# hexo 官方 GitHub Pages 做法（hexojs/site docs/github-pages.md）原形，只改三处：
#   ① 分支 source（本仓源在 source，master/legacy-site 是旧产物）
#   ② Node 24（与本机 v24.18.0 同大版本，官方叮嘱与本地一致）
#   ③ 加两步产物侧判据：CNAME 在位且相等（负对照 ④）· 15 篇旧 permalink 目录都生成了（派② 验收前置）
# 不引 hexo-deployer-git。Pages 来源须切到「GitHub Actions」（仓 Settings → Pages，用户按键，博客 P0 §一 第 7 步）。
name: Pages

on:
  push:
    branches:
      - source
  workflow_dispatch:   # C10：切源后「步 8 触发部署」= Actions 页一个 Run workflow 按钮，不用空提交

jobs:
  build:
    runs-on: ubuntu-latest
    # ★N7 实测（2026-09-20，本机 TZ=UTC 模拟 runner）：_config.yml 的 timezone 只管解析稿件日期，
    #   permalink 的 yyyy/mm/dd 按进程本地时区格式化 —— CST 00:30 在 UTC runner 上落到前一天目录。
    #   进程时区也钉成 Asia/Shanghai，解析与格式化才同一口径（回执 C5 的裁定不足以单独成立，已回报）。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.OS }}-npm-cache
          restore-keys: |
            ${{ runner.OS }}-npm-cache
      - name: Install Dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: "★ 负对照 ④：产物根必须有 CNAME 且内容相等，否则这次部署会把自定义域名冲掉"
        run: test -f public/CNAME && test "$(cat public/CNAME)" = "blogs.center-sept.top"
      - name: "★ C18：两份站长验证文件必须在产物里（删了就掉验证）"
        run: |
          for f in google8e02ec5b10c1e8b6.html baidu_verify_codeva-le0FLPCT2F.html; do
            test -s "public/$f" || { echo "缺 public/$f —— 该文件一旦从 source/ 消失，对应搜索引擎的所有权验证立刻失效"; exit 1; }
          done
          echo "GSC 与百度验证文件都在产物里"
      - name: "★ 派②：15 篇旧 permalink 目录都生成了（读 tools/legacy-manifest.tsv）"
        run: |
          n=0
          while IFS=$'\t' read -r p _; do
            case "$p" in \#*|'') continue;; esac
            test -f "public/$p/index.html" || { echo "缺 $p"; exit 1; }
            n=$((n+1))
          done < tools/legacy-manifest.tsv
          test "$n" -eq 15 || { echo "清单不是 15 篇：$n"; exit 1; }
          echo "15 篇旧目录在位"
      - name: "★ P2-4 线 A：sitemap / atom / robots 三件产物在位且非空"
        run: |
          for f in sitemap.xml atom.xml robots.txt; do
            test -s "public/$f" || { echo "缺 public/$f（或为空）—— 搜索引擎收录三件之一"; exit 1; }
          done
          n=$(grep -c '<url>' public/sitemap.xml)
          test "$n" -ge 20 || { echo "sitemap 只有 $n 条 <url>，少于 20（文章 + 分类 + 标签 + 页面）"; exit 1; }
          grep -q 'Sitemap: https://blogs.center-sept.top/sitemap.xml' public/robots.txt || { echo "robots.txt 缺 Sitemap: 行"; exit 1; }
          echo "sitemap $n 条 url · atom $(wc -c < public/atom.xml) 字节 · robots 在位"
      - name: "★ B3（P2-2 回执）：导航五项指向的页面都生成了（分类/标签缺 source/<名>/index.md 时静默 404）"
        run: |
          for p in about archives categories tags; do
            test -f "public/$p/index.html" || { echo "缺 public/$p/index.html —— 导航链接会 404"; exit 1; }
          done
          echo "导航四页在位（首页由 hexo-generator-index 保证）"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # ★ P2-4 线 A：部署成功后把 sitemap 里的 URL 推给百度主动推送接口。
      #   无 BAIDU_PUSH_TOKEN 时**跳过不红** —— 推广是加分项，缺 token 不该让部署显示失败。
      - name: "★ P2-4：百度主动推送（只推本次变更的文章；无 token 跳过；失败只告警不判红）"
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
          PUSH_LIMIT: "10"
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # ★C17（2026-09-24 回执）：推**本次 push 新增/修改的文章**，不是「最新 N 篇」。
          #   「最新 N 篇」在配置类部署上会反复推同一批老文 —— 今天四次调试部署就是实证，
          #   当天配额被烧光后接口一直 over quota。配额是稀缺量，只该花在**真正变了的**文章上。
          #   无文章变更 ⇒ 不推，并注明原因（「没推」与「推失败」是两件事，要能分辨）。
          if [ -z "$BAIDU_PUSH_TOKEN" ]; then
            echo "未配置 Secrets BAIDU_PUSH_TOKEN，跳过百度推送"; exit 0
          fi
          git fetch --depth=50 origin "$AFTER" 2>/dev/null || true
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::warning::取不到 push 前的 sha（首推或历史被截断），本次不推，避免全量烧配额"; exit 0
          fi
          changed=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'source/_posts/*.md' || true)
          if [ -z "$changed" ]; then
            echo "::warning::本次无文章变更（只动了配置/工作流），未推 —— 配额留给真正的新文"; exit 0
          fi
          : > urls.txt
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            slug=$(basename "$f" .md)
            d=$(sed -n 's/^date:[ ]*\([0-9-]\{10\}\).*/\1/p' "$f" | head -1 | tr '-' '/')
            [ -n "$d" ] && echo "https://blogs.center-sept.top/$d/$slug/" >> urls.txt
          done <<< "$changed"
          head -n "$PUSH_LIMIT" urls.txt > u.txt && mv u.txt urls.txt
          n=$(wc -l < urls.txt)
          [ "$n" -gt 0 ] || { echo "::warning::变更的文章取不出 permalink（date 读不到），未推"; exit 0; }
          echo "::warning::本次变更 $(echo "$changed" | wc -l) 篇，推送 $n 条：$(tr '\n' ' ' < urls.txt)"
          for site in "https://blogs.center-sept.top" "blogs.center-sept.top"; do
            resp=$(curl -sS -m 60 -X POST --data-binary @urls.txt \
              "http://data.zz.baidu.com/urls?site=$site&token=$BAIDU_PUSH_TOKEN" \
              -H 'Content-Type: text/plain') || resp='{"error":-1,"message":"curl 失败"}'
            if echo "$resp" | grep -q '"success"'; then
              echo "::warning::成功推送 $(echo "$resp" | python3 -c "import sys,json;print(json.load(sys.stdin).get('success'))") 条，今日剩余配额 $(echo "$resp" | python3 -c "import sys,json;print(json.load(sys.stdin).get('remain'))")（site=$site）"
              exit 0
            fi
            echo "::warning::site=$site 接口返回：$resp"
          done
          echo "::warning::百度推送未成功（站点已正常部署，本步不判失败）。对照："
          echo "::warning::over quota = 当日配额用尽，次日恢复；token invalid = token 不对或带空白；401 = site 与站长平台登记的不一致"
          exit 0
